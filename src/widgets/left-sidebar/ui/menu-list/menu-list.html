@let menu = items();
@if (menu.length) {
<nav class="menu">
  <ul class="list">
    @for (item of menu; track item.path) {
    <li class="item">
      <a class="link" [routerLink]="item.path" [title]="item.title">
        <app-link-icon [icon]="item.icon" routerLinkActive="_active" />
      </a>
    </li>
    }
  </ul>
</nav>
}
