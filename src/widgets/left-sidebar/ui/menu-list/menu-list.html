@let menu = items();
@if (menu.length) {
  <nav class="menu">
    <ul class="list">
      @for (item of menu; track item.path) {
        <li class="item">
          <a class="link" [routerLink]="item.path" routerLinkActive="_active">
            <svg class="icon" [lucideIcon]="item.icon" />
          </a>
        </li>
      }
    </ul>
  </nav>
}
