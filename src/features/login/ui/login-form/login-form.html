@let form = loginForm();
<app-form [form]="form">
  <h1>Вхід</h1>
  <app-field [field]="loginForm.login" label="Логін" placeholder="Ваш логін" />
  <app-field [field]="loginForm.password" label="Пароль" placeholder="Ваш пароль" type="password" />
  <app-button [disabled]="form.invalid()">Увійти</app-button>
</app-form>
